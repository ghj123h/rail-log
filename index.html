<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>逐秒行车志 · GNSS 列车运转实测</title>
  <meta name="description" content="铁路运转 GNSS 实测归档：全网实测总线路图、京津城际合集与逐秒速度曲线。">
  <link rel="icon" href="assets/ui/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/ui/site.css?v=1">
</head>
<body data-page="home">
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="./" aria-label="逐秒行车志首页">
      <img class="brand-icon" src="assets/ui/icon.svg" alt="" width="30" height="30">
      <span class="brand-text">
        <strong>逐秒行车志</strong>
        <small>GNSS 列车运转实测</small>
      </span>
    </a>
    <nav class="main-nav" aria-label="主导航">
      <a href="./" aria-current="page">总览</a>
      <a href="collection.html?id=jingjin">京津城际</a>
    </nav>
  </div>
</header>

<main class="page-shell">
  <div id="home-status" class="status-banner" role="status" hidden></div>

  <dl class="metrics-strip" aria-label="归档概览">
    <div class="metric-card"><dt>实测趟数</dt><dd id="stat-runs">—</dd></div>
    <div class="metric-card"><dt>有效采样总计</dt><dd id="stat-samples">—</dd></div>
    <div class="metric-card"><dt>记录跨度（UTC+8）</dt><dd id="stat-span" class="is-range">—</dd></div>
    <div class="metric-card"><dt>线路合集</dt><dd id="stat-collections">—</dd></div>
  </dl>

  <section id="network-map-section" class="atlas panel" aria-labelledby="network-map-title">
    <div class="atlas-head">
      <div>
        <p class="eyebrow">总线路图</p>
        <h2 id="network-map-title">全网实测轨迹</h2>
      </div>
      <div class="atlas-controls">
        <span id="network-map-summary" class="atlas-summary">准备中</span>
        <div class="zoom-group" role="group" aria-label="地图缩放">
          <button type="button" id="map-zoom-in" aria-label="放大地图" disabled>＋</button>
          <button type="button" id="map-zoom-out" aria-label="缩小地图" disabled>－</button>
          <button type="button" id="map-reset" disabled>复位</button>
        </div>
      </div>
    </div>
    <div id="route-map" tabindex="0" role="application" aria-label="全网实测线路图。滚轮缩放，拖拽平移，方向键微调，双击或按 0 复位。"></div>
    <p id="map-message" class="map-msg" role="status">线路数据载入中…</p>
    <div class="atlas-foot">
      <span>仅标注起止站与交汇站 · 缺测区段保持断开</span>
      <span>滚轮缩放 · 拖拽平移 · 双击复位</span>
    </div>
  </section>

  <section id="collections-section" aria-labelledby="collections-heading" hidden>
    <div class="section-head">
      <div>
        <p class="eyebrow">专题线路</p>
        <h2 id="collections-heading">线路合集</h2>
      </div>
    </div>
    <div id="collections-list" class="collections-grid"></div>
  </section>

  <section aria-labelledby="other-runs-heading">
    <div class="section-head">
      <div>
        <p class="eyebrow">逐趟档案</p>
        <h2 id="other-runs-heading">其他线路的运转</h2>
      </div>
      <div class="filter-controls">
        <input type="search" id="run-search" class="search-input" placeholder="车次 / 车站 / 日期" aria-label="筛选运转记录">
        <span id="filter-count" class="filter-count"></span>
      </div>
    </div>
    <div id="run-grid" class="run-grid"></div>
    <div id="empty-filter" class="empty-state" hidden>没有匹配筛选条件的运转记录。</div>
    <div id="runs-empty" class="empty-state" hidden>暂无独立运转记录。</div>
  </section>
</main>

<footer class="site-footer">
  <div class="site-footer-inner">
    <span>时间均为北京时间（UTC+8）· 速度与速度精度为设备 GNSS 报告值，色带约对应 68% 置信 · 站台与河道数据 <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap 贡献者</a></span>
    <span>图表：Apache ECharts</span>
  </div>
</footer>

<script src="assets/ui/common.js?v=1"></script>
<script src="assets/network-map-data.js?v=5"></script>
<script src="assets/route-map.js?v=21"></script>
<script src="assets/network-map.js?v=6"></script>
<script src="assets/ui/home.js?v=1"></script>
</body>
</html>

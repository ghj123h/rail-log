<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>线路合集 · Rail Log</title>
  <meta name="description" content="按记录日期查看同一线路的运行记录及沿途车站。">
  <link rel="icon" href="assets/rail-mark.svg">
  <link rel="stylesheet" href="assets/styles.css?v=17">
  <link rel="stylesheet" href="assets/catalog.css?v=1">
</head>
<body>
<header class="site-bar">
  <div class="site-bar-inner">
    <a class="brand" href="./" aria-label="Rail Log 首页"><span class="brand-mark" aria-hidden="true"></span>Rail Log</a>
    <nav aria-label="站点导航">
      <a href="./">记录目录</a>
      <a href="./#collection-section" aria-current="page">线路合集</a>
    </nav>
  </div>
</header>
<main class="catalog-shell collection-page">
  <header class="collection-head">
    <div class="collection-ident">
      <p id="catalog-period" class="catalog-period" hidden></p>
      <h1 id="collection-title">线路合集</h1>
    </div>
    <div id="collection-stations" class="collection-stations" hidden>
      <span>记录起讫站</span>
      <p id="endpoint-list"></p>
    </div>
  </header>
  <details id="network-map-section" class="chart-card route-map-card network-map-card catalog-map" aria-labelledby="network-map-title">
      <summary class="network-map-toggle">
        <span class="catalog-symbol map-symbol" aria-hidden="true"><i></i></span>
        <span class="map-entry-text"><span id="network-map-title">合集路线图</span><span class="map-caption"><span id="network-map-summary"></span><span class="map-scope">沿途车站</span></span></span>
      </summary>
      <div class="toolbar">
        <div class="zoom-buttons" role="group" aria-label="线路图缩放">
          <button id="map-zoom-in" aria-label="放大线路图" disabled>＋</button>
          <button id="map-zoom-out" aria-label="缩小线路图" disabled>−</button>
          <button id="map-reset" disabled>全程</button>
        </div>
      </div>
      <div id="route-map" tabindex="0" role="application" aria-label="线路图。滚轮缩放，拖动平移，Home 键或双击显示全程。"></div>
      <p id="map-message" class="map-message" role="status">正在载入线路图…</p>
      <div class="chart-footer">
        <a class="map-attribution" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">河道与站台 © OpenStreetMap contributors</a>
        <span>滚轮缩放 · 拖动平移 · 双击还原</span>
      </div>
    </details>
  <section class="timetable" aria-labelledby="record-heading">
    <div class="timetable-heading">
      <h2 id="record-heading">合集记录</h2>
      <span class="record-list-meta"><span id="record-count"></span><span>北京时间 UTC+8</span></span>
    </div>
    <p id="catalog-message" class="notice" role="status">正在载入记录目录…</p>
    <div id="timetable-columns" class="timetable-columns" aria-hidden="true" hidden>
      <span>记录日期</span><span>车次</span><span>记录区间</span><span>采样时段</span><span>采样点</span><span></span>
    </div>
    <ul id="records" class="timetable-list" aria-label="合集记录目录"></ul>
  </section>
</main>
<script src="assets/network-map-data.js?v=4"></script>
<script src="assets/route-map.js?v=20"></script>
<script src="assets/network-map.js?v=5"></script>
<script src="assets/catalog.js?v=9"></script>
</body>
</html>
